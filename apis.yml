aid: script-health
name: Script Health
description: >-
  Script Health (operating as "Scripted", scripted.co) is a healthcare technology
  company that lets community pharmacies deliver clinical services and prescribe
  for common conditions, so patients can skip the trip to the doctor and get
  same-day care at their local pharmacy. Its platform covers appointment booking
  and walk-in intake, clinical service administration, medical claims and pharmacy
  billing (CLIA waivers, collaborative practice agreements), and patient-record
  management across services including chronic conditions, general and urgent care,
  vaccines, testing, sexual and reproductive health, and skin and hair health.
  Scripted also builds native integrations into pharmacy management systems (its
  first with Liberty RXQ) so pharmacies can run clinical services inside their
  existing PMS. A Techstars-backed portfolio company; the original scripthealth.co
  domain now redirects to scripted.co. No public developer API, SDK, or API
  documentation is published at this time.
